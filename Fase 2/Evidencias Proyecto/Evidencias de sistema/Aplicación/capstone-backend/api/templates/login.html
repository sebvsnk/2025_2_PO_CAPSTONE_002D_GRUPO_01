{% load static %}
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Iniciar sesión · APT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --muted: #94a3b8;
    --text: #e2e8f0;
    --accent: #22d3ee;
    --bad: #ef4444;
  }
  * { box-sizing: border-box; }
  html {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    min-height: 100vh;
    background: var(--bg);
    background-image: radial-gradient(1000px 600px at 10% -10%, #0b1220, var(--bg) 60%);
    font-family: 'Inter', ui-sans-serif, system-ui;
    color: var(--text);
  }
  .card {
    width: min(400px, 90vw);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 28px;
  }
  h1 { margin: 0 0 8px; font-size: 24px; font-weight: 700; }
  p { margin: 0 0 20px; color: var(--muted); }
  form { padding: 0; margin: 0; }
  label {
    display: block;
    margin: 16px 0 6px;
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
  }
  input {
    font-family: inherit;
    font-size: 15px;
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #0f172a;
    color: var(--text);
    transition: all 0.2s ease;
  }
  input:focus {
    border-color: var(--accent);
    outline: none;
    box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.2);
  }
  button {
    font-family: inherit;
    font-size: 15px;
    width: 100%;
    margin-top: 24px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(34, 211, 238, .4);
    background: rgba(34, 211, 238, .15);
    color: var(--accent);
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  button:hover { background: rgba(34, 211, 238, .25); }
  .err {
    margin-top: 16px;
    color: var(--bad);
    font-size: 14px;
    font-weight: 600;
    min-height: 20px;
  }
</style>
</head>
<body>
  <form class="card" method="post" action="{% url 'login' %}">
    <h1>Dashboard API</h1>
    <p>Inicia sesión con tu cuenta de Staff.</p>
    
    {% csrf_token %}
    
    <label for="username">Usuario</label>
    <input id="username" name="username" placeholder="tu-usuario-staff" autocomplete="username" />
    
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" />
    
    <button type="submit">Iniciar sesión</button>
    
    <div class="err">{{ error }}</div>
  </form>
</body>
</html>
